# Alembic configuration — Viveka backend
# DATABASE_URL is read from the environment in env.py; the placeholder here is
# overridden at runtime and must NOT be committed with real credentials.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os

# Placeholder — env.py overrides this from DATABASE_URL env var
sqlalchemy.url = postgresql+psycopg2://placeholder

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
