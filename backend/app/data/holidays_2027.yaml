# NSE and BSE trading holidays for 2027.
#
# Several fixed-date Indian holidays fall on weekends in 2027 — they are
# included for completeness (the DB seeder records them) but is_trading_day()
# will return False for them regardless via the weekend check.
#
# Floating holidays (type: estimated) should be verified against the official
# exchange calendar before the date approaches:
#   NSE: https://www.nseindia.com/products-services/equity-market-trading-holidays
#   BSE: https://www.bseindia.com/static/markets/MarketInfo/ExchHolidays.aspx
#
# Day-of-week notes for 2027 (reference: Jan 1, 2027 = Friday):
#   Jan 26 (Republic Day)    = Tuesday  [fixed]
#   Apr 02 (Good Friday)     = Friday   [estimated: Easter ~Apr 4, 2027]
#   Apr 14 (Ambedkar Jayanti)= Wednesday[fixed: always Apr 14]
#   May 01 (Maharashtra Day) = Saturday [fixed — weekend, included for completeness]
#   Oct 02 (Gandhi Jayanti)  = Saturday [fixed — weekend, included for completeness]
#   Nov 17 (Diwali Muhurat)  = Wednesday[estimated]
#   Dec 25 (Christmas)       = Saturday [fixed — weekend, included for completeness]

