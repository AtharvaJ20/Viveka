# Sector-to-company mapping for Phase 1 OHLCV ingestion and sector ranking.
#
# Data source: NIFTY sectoral index constituents published by NSE India.
# Reference: https://www.nseindia.com/products-services/indices-sectoral-indices
# Effective date: 2026-09-01
#
# Decision D2 (2026-09-26): map_version is stored in sectors.version (INT = 1).
# The UNIQUE(name, classification_source, version) constraint on the sectors
# table is the canonical version key. No column is added to sector_mappings;
# no separate sector_map_versions table is needed. The ranking layer reads
# sector.version at query time and exposes it as SectorRank.map_version
# (e.g. "v1"). See INBOX.md 2026-09-26 14:10 for the full decision record.
#
# Ticker format: bare NSE symbol with no .NS suffix. The DataFetcher
# (app.fetchers.nse_yfinance) appends .NS before calling yfinance.
# Special characters in tickers (hyphens, ampersands) are quoted below.
#
# Company names: loader.py sets name = ticker_nse as a placeholder.
# Full company names can be enriched in a later task without re-running
# the loader.

version: 1
classification_source: "NIFTY_INDEX"
effective_date: "2026-09-01"

sectors:

