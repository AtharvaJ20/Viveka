[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "viveka-backend"
version = "0.1.0"
description = "Viveka — Personal Stock Research & Monitoring Agent (backend)"
requires-python = ">=3.11"
dependencies = [
    # Web framework
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",

    # Database — sync driver for Alembic/APScheduler, async driver for FastAPI
    "sqlalchemy>=2.0.30",
    "alembic>=1.13.2",
    "psycopg2-binary>=2.9.9",   # sync: Alembic + APScheduler job store
    "asyncpg>=0.29.0",           # async: FastAPI request handlers

    # Config & validation
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",

    # Auth
    "argon2-cffi>=23.1.0",       # Argon2id password hashing (SR-AUTH-005)
    "itsdangerous>=2.2.0",       # session token signing
    "slowapi>=0.1.9",            # rate limiting middleware (SR-AUTH-007)

    # Scheduler
    "apscheduler>=3.10.4",       # APScheduler 3.x with SQLAlchemy job store

    # LLM (Phase 4+ active use; client stub ships Phase 0)
    "anthropic>=0.28.0",

    # HTTP client (news fetching, FX rate, alternate source resolution)
    "httpx>=0.27.0",

    # Market data (NSE OHLCV — Phase 1; BSE Bhavcopy added in Phase 5)
    "yfinance>=0.2.40",
    "pandas>=2.0.0",

    # Data file parsing (sector_map_v1.yaml, holidays YAML)
    "pyyaml>=6.0.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "types-psycopg2>=2.9.21",
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.7",
    "pytest-mock>=3.14.0",
    "pytest-cov>=5.0.0",
    "anyio[trio]>=4.4.0",
]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy", "sqlalchemy.ext.mypy.plugin"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["app"]
